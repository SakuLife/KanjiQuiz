name: KanjiQuiz Automation

on:
  schedule:
    # 毎日 17:00 JST (08:00 UTC) に実行 - 20:00予約投稿のため
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if already executed today'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'nul'

env:
  TZ: Asia/Tokyo

# GitHub Actionsの権限設定
permissions:
  contents: read
  actions: read

jobs:
  video-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 耐久版動画エンコード対応のため120分に延長

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y fonts-noto-cjk
        sudo apt-get install -y xvfb
        sudo apt-get install -y p7zip-full

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install VOICEVOX Engine
      run: |
        echo "📦 VOICEVOX Engine v0.24.1 ダウンロード開始..."
        cd /tmp
        wget https://github.com/VOICEVOX/voicevox_engine/releases/download/0.24.1/voicevox_engine-linux-cpu-x64-0.24.1.7z.001
        echo "📂 VOICEVOX Engineの解凍中..."
        7z x voicevox_engine-linux-cpu-x64-0.24.1.7z.001
        chmod +x linux-cpu-x64/run
        ls -la linux-cpu-x64/
        echo "✅ VOICEVOX Engine インストール完了"
        echo "VOICEVOX_ENGINE_PATH=/tmp/linux-cpu-x64/run" >> $GITHUB_ENV

    - name: Setup environment variables
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os

        # シークレットから改行・空白を除去して環境変数に設定
        secrets = {
            'SPREADSHEET_ID': os.environ.get('INPUT_SPREADSHEET_ID', ''),
            'GEMINI_API_KEY': os.environ.get('INPUT_GEMINI_API_KEY', ''),
            'DISCORD_WEBHOOK_URL': os.environ.get('INPUT_DISCORD_WEBHOOK_URL', ''),
            'YT_CLIENT_ID': os.environ.get('INPUT_YT_CLIENT_ID', ''),
            'YT_CLIENT_SECRET': os.environ.get('INPUT_YT_CLIENT_SECRET', ''),
            'YT_REFRESH_TOKEN': os.environ.get('INPUT_YT_REFRESH_TOKEN', ''),
        }

        with open(os.environ['GITHUB_ENV'], 'a') as f:
            for key, value in secrets.items():
                # 改行・空白・タブを除去
                clean_value = value.strip().replace('\n', '').replace('\r', '').replace('\t', '')
                if clean_value:
                    f.write(f"{key}={clean_value}\n")
                    print(f"Set {key} (length: {len(clean_value)})")
                else:
                    print(f"Warning: {key} is empty")
        PYTHON_SCRIPT
      env:
        INPUT_SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        INPUT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        INPUT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        INPUT_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        INPUT_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        INPUT_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    - name: Create required directories
      run: |
        mkdir -p json
        mkdir -p logs
        mkdir -p video
        mkdir -p voice
        mkdir -p temp

    - name: Setup Google Service Account
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os
        import json

        # SecretsからJSONを取得
        gcp_sa_json = os.environ.get('GCP_SA_JSON', '')

        if not gcp_sa_json or gcp_sa_json == 'null':
            print("❌ GCP_SA_JSON が設定されていません")
            exit(1)

        # JSONファイルを書き込み
        try:
            # まずJSONとして検証
            json_data = json.loads(gcp_sa_json)

            # ファイルに書き込み
            os.makedirs('json', exist_ok=True)
            with open('json/credentials.json', 'w', encoding='utf-8') as f:
                json.dump(json_data, f, indent=2, ensure_ascii=False)

            os.chmod('json/credentials.json', 0o600)
            print("✅ Google Service Account認証情報を配置しました")
            print("✅ JSON形式の検証に成功しました")
        except json.JSONDecodeError as e:
            print(f"❌ credentials.jsonが無効なJSON形式です: {e}")
            print("💡 ヒント: GCP_SA_JSONには、credentials.jsonファイルの内容全体をそのまま貼り付けてください")
            print(f"📝 最初の100文字: {gcp_sa_json[:100]}")
            exit(1)
        except Exception as e:
            print(f"❌ エラーが発生しました: {e}")
            exit(1)
        PYTHON_SCRIPT
      env:
        GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

    - name: Setup YouTube OAuth
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os
        import json

        # SecretsからJSONを取得
        yt_client_secret_json = os.environ.get('YT_CLIENT_SECRET_JSON', '')

        if not yt_client_secret_json or yt_client_secret_json == 'null':
            print("❌ YT_CLIENT_SECRET_JSON が設定されていません")
            exit(1)

        # JSONファイルを書き込み
        try:
            # まずJSONとして検証
            json_data = json.loads(yt_client_secret_json)

            # ファイルに書き込み
            os.makedirs('json', exist_ok=True)
            with open('json/client_secret.json', 'w', encoding='utf-8') as f:
                json.dump(json_data, f, indent=2, ensure_ascii=False)

            os.chmod('json/client_secret.json', 0o600)
            print("✅ YouTube OAuth認証情報を配置しました")
            print("✅ JSON形式の検証に成功しました")
        except json.JSONDecodeError as e:
            print(f"❌ client_secret.jsonが無効なJSON形式です: {e}")
            print("💡 ヒント: YT_CLIENT_SECRET_JSONには、client_secret.jsonファイルの内容全体をそのまま貼り付けてください")
            print(f"📝 最初の100文字: {yt_client_secret_json[:100]}")
            exit(1)
        except Exception as e:
            print(f"❌ エラーが発生しました: {e}")
            exit(1)
        PYTHON_SCRIPT
      env:
        YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}

    - name: Setup YouTube Token Pickle
      run: |
        if [ -z "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" ]; then
          echo "⚠️  YOUTUBE_TOKEN_PICKLE が設定されていません"
          echo "⚠️  YouTube認証は初回実行時に手動で行う必要があります"
          exit 0
        fi
        echo "📝 YouTube認証トークンをデコード中..."
        # base64文字列から改行と空白を削除
        TOKEN_B64=$(echo "${{ secrets.YOUTUBE_TOKEN_PICKLE }}" | tr -d '\n\r\t ')
        if [ -z "$TOKEN_B64" ]; then
          echo "❌ YOUTUBE_TOKEN_PICKLE が空です"
          exit 1
        fi
        # base64デコード（エラーハンドリング付き）
        if echo "$TOKEN_B64" | base64 -d > token.pickle 2>/dev/null; then
          if [ -f token.pickle ] && [ -s token.pickle ]; then
            chmod 600 token.pickle
            FILE_SIZE=$(stat -c%s token.pickle 2>/dev/null || stat -f%z token.pickle 2>/dev/null || echo "unknown")
            echo "✅ YouTube認証トークンを配置しました ($FILE_SIZE bytes)"
          else
            echo "❌ token.pickleファイルの作成に失敗しました（空のファイル）"
            exit 1
          fi
        else
          echo "❌ base64デコードに失敗しました"
          echo "💡 ヒント: YOUTUBE_TOKEN_PICKLEは、encode_token.pyで生成したBase64文字列をそのまま貼り付けてください"
          exit 1
        fi

    - name: Send start notification
      continue-on-error: true
      run: |
        python -c "
        import os, requests, datetime
        webhook_url = os.environ.get('DISCORD_WEBHOOK_URL', '')
        if webhook_url:
            now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
            message = {
                'content': f'🚀 **KanjiQuiz自動生成開始**\n開始時刻: {now.strftime(\"%Y-%m-%d %H:%M JST\")}\n実行環境: GitHub Actions'
            }
            requests.post(webhook_url, json=message)
        "

    - name: Run KanjiQuiz automation
      id: quiz_generation
      continue-on-error: true
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        python run_quiz_bot.py --github-actions
      env:
        PYTHONPATH: ${{ github.workspace }}
        VOICEVOX_ENGINE_PATH: ${{ env.VOICEVOX_ENGINE_PATH }}

    - name: Check video output
      id: check_video
      if: always()
      run: |
        if ls video/*.mp4 1>/dev/null 2>&1; then
          echo "video_exists=true" >> $GITHUB_OUTPUT
          echo "✅ 動画ファイルが見つかりました:"
          ls -lh video/*.mp4
        else
          echo "video_exists=false" >> $GITHUB_OUTPUT
          echo "❌ 動画ファイルが見つかりません。動画生成に失敗した可能性があります。"
        fi

    - name: Upload video artifacts
      if: steps.check_video.outputs.video_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kanji-quiz-video-${{ github.run_number }}
        path: |
          video/*.mp4
          video/*_thumbnail.jpg
          logs/*.log
        retention-days: 7

    - name: Upload logs on failure
      if: steps.check_video.outputs.video_exists != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kanji-quiz-logs-failed-${{ github.run_number }}
        path: |
          logs/*.log
          temp/*.log
        retention-days: 7

    - name: Send completion notification
      if: always()
      continue-on-error: true
      run: |
        python -c "
        import os, requests, datetime
        webhook_url = os.environ.get('DISCORD_WEBHOOK_URL', '')
        if webhook_url:
            now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
            status = '✅ 成功' if '${{ steps.quiz_generation.outcome }}' == 'success' else '❌ 失敗'
            message = {
                'content': f'📺 **KanjiQuiz自動生成完了**\nステータス: {status}\n完了時刻: {now.strftime(\"%Y-%m-%d %H:%M JST\")}\n実行ID: ${{ github.run_number }}'
            }
            requests.post(webhook_url, json=message)
        "

  metrics-collection:
    runs-on: ubuntu-latest
    needs: video-generation
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup environment variables
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os

        secrets = {
            'SPREADSHEET_ID': os.environ.get('INPUT_SPREADSHEET_ID', ''),
            'DISCORD_WEBHOOK_URL': os.environ.get('INPUT_DISCORD_WEBHOOK_URL', ''),
            'YT_CLIENT_ID': os.environ.get('INPUT_YT_CLIENT_ID', ''),
            'YT_CLIENT_SECRET': os.environ.get('INPUT_YT_CLIENT_SECRET', ''),
            'YT_REFRESH_TOKEN': os.environ.get('INPUT_YT_REFRESH_TOKEN', ''),
        }

        with open(os.environ['GITHUB_ENV'], 'a') as f:
            for key, value in secrets.items():
                clean_value = value.strip().replace('\n', '').replace('\r', '').replace('\t', '')
                if clean_value:
                    f.write(f"{key}={clean_value}\n")
                    print(f"Set {key} (length: {len(clean_value)})")
                else:
                    print(f"Warning: {key} is empty")
        PYTHON_SCRIPT
      env:
        INPUT_SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        INPUT_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        INPUT_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        INPUT_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        INPUT_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    - name: Setup Google Service Account
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os
        import json

        gcp_sa_json = os.environ.get('GCP_SA_JSON', '')

        if not gcp_sa_json or gcp_sa_json == 'null':
            print("❌ GCP_SA_JSON が設定されていません")
            exit(1)

        try:
            json_data = json.loads(gcp_sa_json)
            os.makedirs('json', exist_ok=True)
            with open('json/credentials.json', 'w', encoding='utf-8') as f:
                json.dump(json_data, f, indent=2, ensure_ascii=False)
            os.chmod('json/credentials.json', 0o600)
            print("✅ Google Service Account認証情報を配置しました")
        except Exception as e:
            print(f"❌ エラー: {e}")
            exit(1)
        PYTHON_SCRIPT
      env:
        GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

    - name: Setup YouTube OAuth
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os
        import json

        yt_client_secret_json = os.environ.get('YT_CLIENT_SECRET_JSON', '')

        if not yt_client_secret_json or yt_client_secret_json == 'null':
            print("❌ YT_CLIENT_SECRET_JSON が設定されていません")
            exit(1)

        try:
            json_data = json.loads(yt_client_secret_json)
            os.makedirs('json', exist_ok=True)
            with open('json/client_secret.json', 'w', encoding='utf-8') as f:
                json.dump(json_data, f, indent=2, ensure_ascii=False)
            os.chmod('json/client_secret.json', 0o600)
            print("✅ YouTube OAuth認証情報を配置しました")
        except Exception as e:
            print(f"❌ エラー: {e}")
            exit(1)
        PYTHON_SCRIPT
      env:
        YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}

    - name: Run metrics collection
      continue-on-error: true
      run: |
        python core/reporter.py --github-actions
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Send metrics notification
      if: always()
      continue-on-error: true
      run: |
        python -c "
        import os, requests, datetime
        webhook_url = os.environ.get('DISCORD_WEBHOOK_URL', '')
        if webhook_url:
            now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
            message = {
                'content': f'📊 **メトリクス収集完了**\n完了時刻: {now.strftime(\"%Y-%m-%d %H:%M JST\")}'
            }
            requests.post(webhook_url, json=message)
        "
